name: Centralized Git PR Delivery

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        description: 'Optional name of the GitHub artifact containing files generated in an upstream job'
        required: false
        default: ''
      tracked_files:
        type: string
        description: 'Space-separated list of generated files to verify and commit'
        required: true
      git_user_name:
        type: string
        required: false
        default: 'EthanFreestone'
      git_user_email:
        type: string
        required: false
        default: 'ethan.freestone@k-int.co.uk'
      commit_message:
        type: string
        required: true
      append_skip_ci:
        type: string
        required: false
        default: 'true'
      branch_prefix:
        type: string
        required: true
      base_branch:
        type: string
        required: false
        default: 'main'
      pr_title:
        type: string
        required: true
      pr_body:
        type: string
        required: false
        default: 'Automated compliance update via pipeline.'
    secrets:
      GITLAB_DEPLOY_USER:
        required: true
      GITLAB_DEPLOY_TOKEN:
        required: true

jobs:
  deliver-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Commit via PR
        uses: k-int/github-actions/.github/actions/commit-via-pr@main
        with:
          artifact_name:   ${{ inputs.artifact_name }}
          tracked_files:   ${{ inputs.tracked_files }}
          git_user_name:   ${{ inputs.git_user_name }}
          git_user_email:  ${{ inputs.git_user_email }}
          commit_message:  ${{ inputs.commit_message }}
          append_skip_ci:  ${{ inputs.append_skip_ci }}
          branch_prefix:   ${{ inputs.branch_prefix }}
          pr_title:        ${{ inputs.pr_title }}
          pr_body:         ${{ inputs.pr_body }}
          deploy_user:     ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token:    ${{ secrets.GITLAB_DEPLOY_TOKEN }}