name: OpenAPI CI/CD Pipeline

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: "."
    secrets:
      S3_ACCESS_KEY_ID:
        required: true
      S3_SECRET_ACCESS_KEY:
        required: true

jobs:
  # --- STAGE 1: PARALLEL LINTERS ---

  redocly-lint-and-bundle:
    name: Redocly Validate & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Redocly Action
        uses: k-int/github-actions/.github/actions/openapi/redocly-build@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Upload Bundled Spec Artifact
        uses: actions/upload-artifact@v5
        with:
          name: serials-management-spec
          path: ${{ inputs.working-directory }}/serials-management.yaml

  folio-api-lint:
    name: Folio API Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Run Folio API Linter
        uses: k-int/github-actions/.github/actions/openapi/folio-api-lint@main
        with:
          working-directory: ${{ inputs.working-directory }}

  folio-schema-lint:
    name: Folio Schema Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Run Folio Schema Linter
        uses: k-int/github-actions/.github/actions/openapi/folio-api-schema-lint@main
        with:
          working-directory: ${{ inputs.working-directory }}


  # --- STAGE 2: DEPENDENT DEPLOYMENT ---

  folio-docs-deploy:
    name: Folio Doc Gen & S3 Deploy
    needs: [redocly-lint-and-bundle, folio-api-lint, folio-schema-lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Run Folio Deployment Action
        uses: k-int/github-actions/.github/actions/openapi/folio-api-doc-deploy@main
        with:
          working-directory: ${{ inputs.working-directory }}
          s3_access_key_id: ${{ secrets.S3_ACCESS_KEY_ID }}
          s3_secret_access_key: ${{ secrets.S3_SECRET_ACCESS_KEY }}