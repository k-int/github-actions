name: OpenAPI CI/CD Pipeline

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: "."
      openapi-filename:
        type: string
        required: true
    secrets:
      S3_ACCESS_KEY_ID:
        required: true
      S3_SECRET_ACCESS_KEY:
        required: true
      GITLAB_DEPLOY_USER:
        required: true
      GITLAB_DEPLOY_TOKEN:
        required: true

jobs:
  # --- STAGE 1: BUILD THE CONSOLIDATED SPEC ---
  redocly-bundle:
    name: Redocly Bundle Spec
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Run Redocly Action
        uses: k-int/github-actions/.github/actions/openapi/redocly-build@main
        with:
          working-directory: ${{ inputs.working-directory }}

      # --- INVOKING REFACTORED DIRECT COMMIT ENGINE ---
      - name: Auto-Commit Bundled Specification
        # DO NOT run this on main, instead it MUST be inside of the pull request
        # That prevents issues with
        if: github.event_name == 'pull_request'
        uses: k-int/github-actions/.github/actions/commit-directly@main
        with:
          tracked_files: "${{ inputs.working-directory }}/${{ inputs.openapi-filename }}"
          commit_message: "chore: auto-update bundled openapi specification"
          deploy_user: ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      # Isolate the bundled asset into a clean directory for artifact sharing
      - name: Isolate Bundled Specification
        run: |
          mkdir -p built-spec
          cp ${{ inputs.working-directory }}/${{ inputs.openapi-filename }} built-spec/

      - name: Upload Bundled Spec Artifact
        uses: actions/upload-artifact@v5
        with:
          name: compiled-openapi-spec
          path: built-spec/

  # --- STAGE 2: PARALLEL LINTERS (RUNNING AGAINST BUNDLED SPEC) ---
  folio-api-lint:
    name: Folio API Lint
    needs: redocly-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Compiled Spec
        uses: actions/download-artifact@v5
        with:
          name: compiled-openapi-spec
          path: built-spec

      - name: Run Folio API Linter
        uses: k-int/github-actions/.github/actions/openapi/folio-api-lint@main
        with:
          api_directories: 'built-spec'

  folio-schema-lint:
    name: Folio Schema Lint
    needs: redocly-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Compiled Spec
        uses: actions/download-artifact@v5
        with:
          name: compiled-openapi-spec
          path: built-spec

      - name: Run Folio Schema Linter
        uses: k-int/github-actions/.github/actions/openapi/folio-api-schema-lint@main
        with:
          api_directories: 'built-spec'

  # --- STAGE 3: DOC GENERATION & DEPLOYMENT ---
  folio-docs-deploy:
    name: Folio Doc Gen & S3 Deploy
    needs: [redocly-bundle, folio-api-lint, folio-schema-lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Download Compiled Spec
        uses: actions/download-artifact@v5
        with:
          name: compiled-openapi-spec
          path: built-spec

      - name: Run Folio Deployment Action
        uses: k-int/github-actions/.github/actions/openapi/folio-api-doc-deploy@main
        with:
          api_directories: 'built-spec'
          s3_access_key_id: ${{ secrets.S3_ACCESS_KEY_ID }}
          s3_secret_access_key: ${{ secrets.S3_SECRET_ACCESS_KEY }}