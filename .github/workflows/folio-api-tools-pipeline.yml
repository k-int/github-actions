name: Folio API Tools Pipeline

on:
  workflow_call:
    inputs:
      spec-dir:
        type: string
        required: true
        description: "A dedicated directory containing ONLY target openapi spec files (e.g., docs/API/yamls)"
      artifact-name:
        type: string
        required: false
        default: ""
        description: "Optional artifact name to download directly into spec-dir"
      allowed-deploy-branch:
        type: string
        required: false
        default: "main master"
        description: "Space-separated list of branches allowed to deploy to S3. Supports direct push branch names or active PR source branches (e.g., 'ci/openapi-tweak')"
    secrets:
      S3_ACCESS_KEY_ID:
        required: true
      S3_SECRET_ACCESS_KEY:
        required: true

jobs:
  folio-api-lint:
    name: Folio API Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Compiled Spec (Optional)
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.spec-dir }}

      - name: Run Folio API Linter
        uses: k-int/github-actions/.github/actions/openapi/folio-api-lint@main
        with:
          api_directories: ${{ inputs.spec-dir }}

  folio-schema-lint:
    name: Folio Schema Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Compiled Spec (Optional)
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.spec-dir }}

      - name: Run Folio Schema Linter
        uses: k-int/github-actions/.github/actions/openapi/folio-api-schema-lint@main
        with:
          api_directories: ${{ inputs.spec-dir }}

  folio-docs-deploy:
    name: Folio Doc Gen & S3 Deploy
    needs: [folio-api-lint, folio-schema-lint]
    if: |
      (
        github.event_name == 'push' &&
        contains(inputs.allowed-deploy-branch, github.ref_name)
      ) || (
        github.event_name == 'pull_request' &&
        contains(inputs.allowed-deploy-branch, github.event.pull_request.head.ref)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Download Compiled Spec (Optional)
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.spec-dir }}

      - name: Run Folio Deployment Action
        uses: k-int/github-actions/.github/actions/openapi/folio-api-doc-deploy@main
        with:
          api_directories: ${{ inputs.spec-dir }}
          s3_access_key_id: ${{ secrets.S3_ACCESS_KEY_ID }}
          s3_secret_access_key: ${{ secrets.S3_SECRET_ACCESS_KEY }}