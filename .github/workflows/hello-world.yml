name: Hello World Example Action

on:
  workflow_call:
    # 1. Define the top-level inputs allowed by the orchestrator
    inputs:
      hello_text:
        description: "Custom string for the Hello phase"
        type: string
        required: false
        default: "hello"
      world_text:
        description: "Custom string for the World phase"
        type: string
        required: false
        default: "world"
    secrets:
      GITLAB_DEPLOY_USER:
        required: true
      GITLAB_DEPLOY_TOKEN:
        required: true

jobs:
  # --- JOB 1 ---
  job-hello:
    name: Echo Hello Task
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Pipeline Scripts
        # FIXME This should be on main normally
        uses: k-int/github-actions/.github/actions/clone-pipeline-scripts@test
        with:
          deploy_user: ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      # 2. Pass the top-level input down to the composite action
      - name: Execute Echo Hello Action
        uses: |
          chmod +x ./pipeline-scripts/scripts/hello-world/echo-hello.sh
          
          ./pipeline-scripts/scripts/hello-world/echo-hello.sh \
            --text    "${{ inputs.hello_text }}" \

  # --- JOB 2 ---
  job-world:
    name: Echo World Task
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Pipeline Scripts
        # FIXME This should be on main normally
        uses: k-int/github-actions/.github/actions/clone-pipeline-scripts@test
        with:
          deploy_user: ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      # 3. Pass the top-level input down to the composite action
      - name: Execute Echo World Action
        uses: |
          chmod +x ./pipeline-scripts/scripts/hello-world/echo-world.sh
          
          ./pipeline-scripts/scripts/hello-world/echo-hello.sh \
            --text    "${{ inputs.world_text }}" \

  # --- JOB 3 ---
  job-combine:
    name: Combine Artifacts Task
    runs-on: ubuntu-latest
    needs: [job-hello, job-world]
    steps:
      - name: Initialize Pipeline Scripts
        # FIXME This should be on main normally
        uses: k-int/github-actions/.github/actions/clone-pipeline-scripts@test
        with:
          deploy_user: ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      # Combine doesn't need input variables; it relies entirely on the generated artifacts
      - name: Execute Combine Action
        uses: |
          chmod +x ./pipeline-scripts/scripts/hello-world/combine.sh
          
          ./pipeline-scripts/scripts/hello-world/combine.sh