name: Centralized Gradle SBOM Generation

on:
  workflow_call:
    inputs:
      gradle_project_path:
        type: string
        required: false
        default: '.'
      sbom_output_path:
        type: string
        required: false
        default: '.'
      syft_args:
        type: string
        required: false
        default: ''
      tracked_files:
        type: string
        required: false
        default: 'cdx-bom.json'
      commit_lockfiles:
        type: string
        required: false
        default: 'false'
    secrets:
      GITLAB_DEPLOY_USER:
        required: true
      GITLAB_DEPLOY_TOKEN:
        required: true

jobs:
  # =============================================================================
  # PHASE 1: Dependency Lock Generation
  # =============================================================================
  generate-locks:
    name: Generate gradle locks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize pipeline scripts
        uses: k-int/github-actions/.github/actions/clone-pipeline-scripts@main
        with:
          deploy_user: ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Inject lockfiles
        shell: bash
        run: |
          chmod +x ./pipeline-scripts/scripts/sbom-generation/gradle/generate-locks.sh
          ./pipeline-scripts/scripts/sbom-generation/gradle/generate-locks.sh \
            --dir "${{ github.workspace }}/${{ inputs.gradle_project_path }}"

      - name: Upload lockfiles
        uses: actions/upload-artifact@v5
        with:
          name: raw-gradle-lockfiles
          path: |
            ${{ inputs.gradle_project_path }}/**/gradle.lockfile
            ${{ inputs.gradle_project_path }}/gradle.lockfile
          if-no-files-found: ignore
          retention-days: 1

  # =============================================================================
  # PHASE 2: Core SBOM Compilation via Syft
  # =============================================================================
  generate-sbom:
    name: Generate SBOM file
    needs: generate-locks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize pipeline scripts
        uses: k-int/github-actions/.github/actions/clone-pipeline-scripts@main
        with:
          deploy_user: ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Retrieve generated locks
        uses: actions/download-artifact@v5
        with:
          name: raw-gradle-lockfiles

      - name: Compile workspace SBOM
        shell: bash
        run: |
          chmod +x ./pipeline-scripts/scripts/sbom-generation/gradle/generate-sbom.sh
          ./pipeline-scripts/scripts/sbom-generation/gradle/generate-sbom.sh \
            --dir "${{ github.workspace }}/${{ inputs.gradle_project_path }}" \
            --output-dir "${{ github.workspace }}/${{ inputs.sbom_output_path }}" \
            --output-file "${{ inputs.tracked_files }}" \
            --syft-args "${{ inputs.syft_args }}"

      - name: Clean unwanted lockfiles before packaging artifacts
        shell: bash
        run: |
          if [ "${{ inputs.commit_lockfiles }}" != "true" ]; then
            echo "🧹 Purging tracking layers for lockfiles so they are excluded from zip packages..."
            find . -name "gradle.lockfile" -type f -delete
          fi

      - name: Upload assets (lockfiles and tracked_files)
        uses: actions/upload-artifact@v5
        with:
          name: compiled-sbom-assets
          path: |
            ${{ inputs.sbom_output_path }}/${{ inputs.tracked_files }}
            ${{ inputs.gradle_project_path }}/**/gradle.lockfile
          if-no-files-found: ignore
          retention-days: 1

  # =============================================================================
  # PHASE 3: Automated Pull Request Sync & Merge Loop
  # =============================================================================
  commit-sbom:
    name: Push and sync SBOM
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Commit via PR
        uses: k-int/github-actions/.github/actions/commit-via-pr@test
        with:
          artifact_name:  "compiled-sbom-assets"
          tracked_files: >-
            ${{ inputs.sbom_output_path }}/${{ inputs.tracked_files }}
            ${{ inputs.commit_lockfiles == 'true' && '**/gradle.lockfile' || '' }}
          commit_message: "chore: automated compliance assets update via Syft"
          branch_prefix:  "sbom-update"
          pr_title:       "Automated SBOM update"
          pr_body:        "Automated SBOM update via Syft."
          deploy_user:    ${{ secrets.GITLAB_DEPLOY_USER }}
          deploy_token:   ${{ secrets.GITLAB_DEPLOY_TOKEN }}